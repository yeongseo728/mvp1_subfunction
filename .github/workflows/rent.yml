# 동네 전월세 시세 자료를 매일 새로 받아요 (2026-11-19 사용자와 정함).
# 매일 한국 시간 새벽 4시쯤 scripts/fetch_rent.mjs 를 돌려 data/rent/ 의 파일만 main에 올려요.
# 앱 화면과 코드는 이 작업으로 바뀌지 않아요. 키는 저장소 설정(Secrets)의 RENT_KEY에 있어요.
name: 시세 자료 받기

on:
  schedule:
    - cron: '7 19 * * *'   # 세계 표준시 19:07 = 한국 시간 04:07
  workflow_dispatch:        # 손으로 한 번 돌리기 (Actions 화면의 Run workflow)

permissions:
  contents: write

concurrency:
  group: rent-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 국토교통부 전월세 실거래가 받기
        env:
          RENT_KEY: ${{ secrets.RENT_KEY }}
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}   # 예전 저장소의 키 이름도 받아요
          # 아파트 전월세 자료를 활용신청하지 않았다면 이 줄로 나머지 3가지만 받아요. 신청했다면 지워도 돼요
          RENT_TYPES: ${{ vars.RENT_TYPES || '' }}
        run: node scripts/fetch_rent.mjs

      - name: 바뀐 자료만 main에 올리기
        run: |
          git add data/rent
          if git diff --cached --quiet; then
            echo "바뀐 자료가 없어요."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "시세 자료 자동 갱신 ($(TZ=Asia/Seoul date +%F))"
          git push origin HEAD:main
